# Example nginx for merged Kushnath Live + Billvice POS
# Django (gunicorn/daphne) on 127.0.0.1:8000
#
# Frontend layout on disk (next to manage.py):
#   frontend/dist/index.html          <- Billvice SPA (Vite base /billvice/)
#   frontend/dist/assets/*.js|css
#   build/                            <- Live storefront legacy assets (optional)
#   media/                            <- uploads
#
# Important: /billvice/* must reach Django (or the alias below).
# Do NOT fall back /billvice/login to the storefront build/index.html.

upstream django_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name kushnathayurveda.com www.kushnathayurveda.com;

    client_max_body_size 25M;

    # --- Billvice assets (fast path; optional but recommended) ---
    # Replace /path/to/project with the real deploy directory.
    location /billvice/assets/ {
        alias /path/to/project/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Billvice SPA routes (/billvice, /billvice/login, /pos, …) ---
    # Django serve_billvice returns frontend/dist/index.html for these.
    # Do NOT use try_files ... /index.html here — that serves storefront home.
    location /billvice {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /billing/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /accounts/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /path/to/project/media/;
    }

    # Storefront + everything else
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
